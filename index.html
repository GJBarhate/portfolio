    <!--
      Resolve the theme before the stylesheet is parsed, so no frame is ever
      painted with the wrong palette.

      Three jobs, in this order:
        1. Read the unified store (`forge:v1`, src/lib/store.js), falling back
           to the pre-v1 `forge-theme` key with its retired-id remap so a
           returning visitor keeps the look they chose.
        2. With no explicit choice — and only then — fall back to Eclipse
           (D-33). Eclipse is the palette the whole site is designed and
           graded around: the hero, the background motifs and the accent
           system are tuned to it, and a first-time visitor on a light-mode
           machine was being shown Paper, the alternate. `system` remains a
           first-class *explicit* choice in the theme toggle and the palette
           for anyone who wants their OS setting followed live.
        3. Publish polarity (`color-scheme`), the motion override (T-025) and
           the recruiter flag, all of which are read by CSS in the very first
           cascade rather than a frame later.
    -->
    <script>
      (function () {
        var THEME_BG = { eclipse: '#05090d', ember: '#080605', paper: '#fbf6f0' };
        var LEGACY = { forest: 'eclipse', ocean: 'eclipse', golden: 'ember', obsidian: 'ember', dawn: 'paper' };
        var root = document.documentElement;
        var theme = null, motion = 'system', recruiter = false;
        try {
          var raw = localStorage.getItem('forge:v1');
          if (raw) {
            var s = JSON.parse(raw) || {};
            theme = s.theme || null;
            motion = s.motion || 'system';
            recruiter = !!(s.prefs && s.prefs.recruiter);
          } else {
            var old = localStorage.getItem('forge-theme');
            if (old) theme = LEGACY[old] || old;
            if (sessionStorage.getItem('forge-recruiter') === '1') recruiter = true;
          }
        } catch (e) { /* private mode, or a corrupt payload — defaults apply */ }

        /*
          D-10j — the URL door into Recruiter Mode.

          The only ways in were a header chip, a keyboard shortcut and a drawer
          event, all of which require the visitor to already be here and to
          already want it. The one traffic source that should land in the short
          version directly is a job board or a LinkedIn click — and that traffic
          arrives carrying `ref` or `utm_source`.

          Resolved HERE rather than in React, and that is the whole point: React
          decides after hydration, so the full experience would paint for a frame
          and then fold away, which is precisely the flash this script exists to
          prevent. Kept deliberately in step with RECRUITER_REFERRERS in
          src/lib/recruiter.js.
        */
        try {
          var params = new URLSearchParams(location.search);
          var explicit = params.get('recruiter');
          if (explicit === '1' || explicit === 'true') recruiter = true;
          else if (explicit === '0' || explicit === 'false') recruiter = false;
          else {
            var src = (params.get('ref') || params.get('utm_source') || '').toLowerCase();
            var HIRING = ['linkedin','lnkd','indeed','naukri','glassdoor','wellfound','angellist','hired','monster','shine','internshala','cutshort','instahyre','hirist','jobs','recruiter','hiring','resume','cv'];
            if (src) {
              for (var i = 0; i < HIRING.length; i++) {
                if (src.indexOf(HIRING[i]) !== -1) { recruiter = true; break; }
              }
            }
          }
        } catch (e) { /* no URLSearchParams, or an opaque origin */ }

        // An explicit `system` still follows the OS. Anything else — no stored
        // value at all, or a retired id — resolves to Eclipse.
        if (theme === 'system') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
            ? 'paper' : 'eclipse';
        } else if (!theme || !THEME_BG[theme]) {
          theme = 'eclipse';
        }

        root.dataset.theme = theme;
        // §6.5 — scrollbars and form controls follow the POLARITY, and they
        // flash the wrong one for a frame if this waits for React.
        root.style.colorScheme = theme === 'paper' ? 'light' : 'dark';
        if (motion && motion !== 'system') root.dataset.motion = motion;
        if (recruiter) root.setAttribute('data-recruiter', '');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', THEME_BG[theme]);
      })();
    </script>
