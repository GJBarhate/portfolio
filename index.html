    <!--
      Resolve the theme before the stylesheet is parsed, so no frame is ever
      painted with the wrong palette.

      Three jobs, in this order:
        1. Read the unified store (`forge:v1`, src/lib/store.js), falling back
           to the pre-v1 `forge-theme` key with its retired-id remap so a
           returning visitor keeps the look they chose.
        2. With no explicit choice — and only then — follow the OS via
           `prefers-color-scheme` (T-034). Defaulting everyone to a dark theme
           regardless of their system setting was D-27.
        3. Publish polarity (`color-scheme`), the motion override (T-025) and
           the recruiter flag, all of which are read by CSS in the very first
           cascade rather than a frame later.
    -->
    <script>
      (function () {
        var THEME_BG = { eclipse: '#05090d', ember: '#080605', paper: '#fbf6f0' };
        var LEGACY = { forest: 'eclipse', ocean: 'eclipse', golden: 'ember', obsidian: 'ember', dawn: 'paper' };
        var root = document.documentElement;
        var theme = null, motion = 'system', recruiter = false;
        try {
          var raw = localStorage.getItem('forge:v1');
          if (raw) {
            var s = JSON.parse(raw) || {};
            theme = s.theme || null;
            motion = s.motion || 'system';
            recruiter = !!(s.prefs && s.prefs.recruiter);
          } else {
            var old = localStorage.getItem('forge-theme');
            if (old) theme = LEGACY[old] || old;
            if (sessionStorage.getItem('forge-recruiter') === '1') recruiter = true;
          }
        } catch (e) { /* private mode, or a corrupt payload — defaults apply */ }

        if (!theme || theme === 'system' || !THEME_BG[theme]) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
            ? 'paper' : 'eclipse';
        }

        root.dataset.theme = theme;
        // §6.5 — scrollbars and form controls follow the POLARITY, and they
        // flash the wrong one for a frame if this waits for React.
        root.style.colorScheme = theme === 'paper' ? 'light' : 'dark';
        if (motion && motion !== 'system') root.dataset.motion = motion;
        if (recruiter) root.setAttribute('data-recruiter', '');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', THEME_BG[theme]);
      })();
    </script>
