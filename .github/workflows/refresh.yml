name: Refresh platform stats

# T-081 — the numbers on the site are fetched at BUILD time and committed, not
# fetched by the visitor's browser. That means no API keys in the bundle, no
# request on the critical path, and no failure mode where a third party being
# slow makes the portfolio slow.
#
# `scripts/fetch-stats.mjs` is fault-tolerant per source: a platform that fails
# keeps its previous value, and `lastUpdated` is written either way so a stale
# number is honest rather than misleading.

on:
  schedule:
    # 04:00 UTC — a quiet hour for every platform this queries, and well before
    # anyone in IST is looking at the site.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-stats.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/lib/platformStats.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "forge-bot"
          git config user.email "noreply@github.com"
          git add src/lib/platformStats.json
          git commit -m "chore: refresh platform stats"
          git push
