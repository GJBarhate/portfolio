name: CI

# T-048 — CI that actually gates.
#
# Every job here mirrors a rule that is written down somewhere in the
# architecture, so a change that quietly breaks one fails here rather than
# reaching a visitor. The three that were decorative before:
#
#   · the visual job ran `npx --yes playwright@1.49.0 test`, which is not the
#     test runner — that lives in `@playwright/test`, which was not a
#     dependency. The job had never run green in its life (D-06).
#   · budgets were absolute ceilings only, so a chunk could grow 40 % and
#     still pass. `budgets` now also compares against main and fails on
#     growth (D-34).
#   · nothing checked encoding, canonical URLs, contrast, overflow or the
#     effect cost — all of which are now build-gated scripts.

on:
  push:
    branches: [main]
  pull_request:

# A superseded run is wasted CI minutes and a confusing red X on an old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  static:
    name: Lint · encoding · breakpoints · contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # ESLint carries the guardrails: no bare requestAnimationFrame, no
      # WebGLRenderer outside glStage, and no `three` / `framer-motion` import
      # outside the gated-island whitelist.
      - run: npm run lint
      # None of these need a build, so they fail in seconds rather than after
      # a four-minute Vite run.
      - run: npm run check:encoding
      - run: npm run check:breakpoints
      - run: npm run check:contrast
      - run: npm run check:effects

  unit:
    name: Unit tests · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage

  build:
    name: Build · budgets · canonical · CSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `build` runs vite and then check-budgets (per-chunk ceilings, the eager
      # total, either heavy chunk appearing in the eager graph, the
      # project-image glob), check-canonical (exactly one first-party origin
      # across HTML/sitemap/robots) and check-csp (the inline script hashes in
      # vercel.json still match the built HTML).
      - run: npm run build
      - name: Record chunk sizes
        run: node scripts/size-report.mjs --write size-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: size-report.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 3

  size-delta:
    name: Bundle size vs main
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:only
      # D-34 — an absolute ceiling lets a chunk grow 40 % and still pass.
      # This fails on >3 % growth in any chunk against the base branch, even
      # when the chunk is comfortably under budget.
      - name: Compare against the base branch
        run: node scripts/size-report.mjs --compare origin/${{ github.base_ref }}

  e2e:
    name: E2E · a11y · visual (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:only
      # The real runner, at the version pinned in package.json — not a
      # `npx --yes` of a package that does not contain a runner at all.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  overflow:
    name: Horizontal overflow (14 widths x 3 themes)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:only
      - run: npx playwright install --with-deps chromium
      # Names the element that overflows, at every matrix width, in every
      # theme, with the drawer and palette open and closed.
      - run: npm run check:overflow
      # The other half of the layout question: a box the right size holding
      # text that is clipped, covered or invisible anyway. Three such defects
      # shipped past every other gate in this repo — see docs/gates/PHASE-5.md.
      - run: npm run check:layout

  lighthouse:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:only
      - run: npx --yes @lhci/cli@0.14.x autorun

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # High and critical only: a portfolio with no server has no realistic
      # exposure to most moderate advisories, and a gate that is red for
      # months is a gate everyone learns to ignore.
      - run: npm audit --audit-level=high
