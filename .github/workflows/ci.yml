name: CI

# §11 — regressions become impossible, not unlikely. Every gate here mirrors a
# budget or a rule that is written down in the architecture, so a change that
# quietly puts three.js back on the critical path fails here rather than
# reaching visitors.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint · build · budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ESLint carries the guardrails: no bare requestAnimationFrame, no
      # WebGLRenderer outside glStage, and no `three` / `framer-motion` import
      # outside the gated-island whitelist.
      - run: npm run lint
      # `build` runs vite and then scripts/check-budgets.mjs, which fails on a
      # per-chunk ceiling, on the eager total, on either heavy chunk appearing
      # in the eager graph, or on the project-image glob matching nothing.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: Lighthouse CI (mobile)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:only
      - run: npx --yes @lhci/cli@0.14.x autorun

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:only
      - run: npx --yes playwright@1.49.0 install --with-deps chromium
      - run: npx --yes playwright@1.49.0 test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diff
          path: test-results
          retention-days: 7
